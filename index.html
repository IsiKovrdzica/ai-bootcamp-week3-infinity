<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BrickPulse, a compact retro brick-breaking browser game."
    />
    <title>BrickPulse</title>
  </head>
  <body>
    <main>
      <h1>BrickPulse</h1>
      <canvas
        id="game"
        width="640"
        height="480"
        aria-label="BrickPulse game area"
      >
        BrickPulse requires a browser with Canvas support.
      </canvas>
      <p class="controls">Move: ← → or A D · Start / restart: Space</p>
      <section id="ai-coach" class="ai-coach" aria-labelledby="ai-coach-title" hidden>
        <h2 id="ai-coach-title">AI Coach</h2>
        <button id="ask-ai-coach" type="button">ASK AI COACH</button>
        <div id="ai-coach-output" class="ai-coach-output" aria-live="polite" aria-atomic="true">
          <p id="ai-coach-status" role="status"></p>
          <p id="ai-coach-summary"></p>
          <p id="ai-coach-recommendation"></p>
          <p id="ai-coach-category"></p>
        </div>
      </section>
      <p id="error" class="error" role="alert"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

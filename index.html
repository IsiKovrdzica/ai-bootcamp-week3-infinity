<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BrickPulse, a compact retro brick-breaking browser game."
    />
    <title>BrickPulse</title>
  </head>
  <body>
    <main>
      <h1>BrickPulse</h1>
      <canvas
        id="game"
        width="640"
        height="480"
        aria-label="BrickPulse game area"
      >
        BrickPulse requires a browser with Canvas support.
      </canvas>
      <p class="controls">Move: ← → or A D · Start / restart: Space</p>
      <p id="error" class="error" role="alert"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
